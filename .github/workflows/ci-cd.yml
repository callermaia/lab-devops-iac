name: CI/CD - Validação IaC e Python

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-validate:
    name: Validar Terraform e Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # --- ETAPA 1: VALIDAÇÃO DO TERRAFORM ---
      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3

      - name: Checar Formatação do Terraform
        run: terraform fmt -check
        working-directory: ./terraform

      - name: Inicializar Terraform
        run: terraform init -backend=false
        working-directory: ./terraform

      - name: Validar Sintaxe do Terraform
        run: terraform validate
        working-directory: ./terraform

      # --- ETAPA 2: VALIDAÇÃO DO PYTHON ---
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint do Código Python (Sintaxe e Erros)
        run: |
          # Checa erros de sintaxe ou variáveis não declaradas
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics